# ============================================================
#  Настройки приложения «Управление поставками»
# ============================================================

# --- Веб-сервер ---
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.application.name=supply-management

# --- Подключение к базе данных PostgreSQL ---
# Адрес сервера, порт и имя базы данных
spring.datasource.url=jdbc:postgresql://localhost:8831/supply_db
# Пользователь PostgreSQL
spring.datasource.username=#######
# Пароль пользователя PostgreSQL (замените на свой)
spring.datasource.password=#######
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Схему создаёт Flyway, Hibernate только проверяет соответствие сущностей таблицам
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow
# Показывать SQL-запросы в консоли (true — для отладки)
spring.jpa.show-sql=false

# --- Миграции Flyway (создание таблиц и демо-данных) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8

# --- Логирование ---
logging.level.ru.rostelecom.supply=INFO
