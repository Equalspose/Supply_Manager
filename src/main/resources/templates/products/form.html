<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content}, ~{::#scripts})}">
<head><title>Товар</title></head>
<body>
<div id="content">
    <a class="back-link" th:href="@{/products}"><i class="bi bi-arrow-left"></i> Номенклатура</a>
    <div class="page-head">
        <h1 th:text="${product.id == null} ? 'Новый товар' : 'Редактирование: ' + ${product.name}">Товар</h1>
    </div>
    <form class="card" th:action="@{/products}" th:object="${product}" method="post" style="max-width:900px">
        <input type="hidden" th:field="*{id}">
        <div class="card-body">
            <div class="form-grid">
                <div class="field">
                    <label>Артикул <span class="req">*</span></label>
                    <input class="input" th:field="*{sku}" th:errorclass="is-invalid" placeholder="ONT-GPON-01">
                    <div class="error" th:errors="*{sku}"></div>
                </div>
                <div class="field">
                    <label>Категория <span class="req">*</span></label>
                    <select class="input" th:field="*{category}" th:errorclass="is-invalid">
                        <option value="">— выберите —</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <div class="error" th:errors="*{category}"></div>
                </div>
                <div class="field full">
                    <label>Наименование <span class="req">*</span></label>
                    <input class="input" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="error" th:errors="*{name}"></div>
                </div>
                <div class="field">
                    <label>Цена закупки, ₽ <span class="req">*</span></label>
                    <input class="input" type="number" step="0.01" min="0" th:field="*{price}" th:errorclass="is-invalid">
                    <div class="error" th:errors="*{price}"></div>
                </div>
                <div class="field">
                    <label>Единица измерения <span class="req">*</span></label>
                    <input class="input" th:field="*{unit}" list="units" th:errorclass="is-invalid">
                    <datalist id="units"><option value="шт"><option value="м"><option value="км"><option value="уп"><option value="компл"></datalist>
                </div>
                <div class="field">
                    <label>Минимальный остаток (по всем складам)</label>
                    <input class="input" type="number" min="0" th:field="*{minStock}" th:errorclass="is-invalid">
                    <div class="help">Ниже этого уровня товар попадает в список дефицита</div>
                    <div class="error" th:errors="*{minStock}"></div>
                </div>
                <div class="field full">
                    <label>Описание</label>
                    <textarea class="input" th:field="*{description}" maxlength="500"></textarea>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <a class="btn btn-light" th:href="@{/products}">Отмена</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Сохранить</button>
        </div>
    </form>
</div>
<div id="scripts"></div>
</body>
</html>
