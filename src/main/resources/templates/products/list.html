<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content}, ~{::#scripts})}">
<head><title>Номенклатура</title></head>
<body>
<div id="content">
    <div class="page-head">
        <div>
            <h1>Номенклатура</h1>
            <div class="sub">Справочник закупаемого оборудования и материалов</div>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" th:href="@{/products/new}" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                <i class="bi bi-plus-lg"></i> Добавить товар
            </a>
        </div>
    </div>
    <div class="card">
        <form class="toolbar" method="get" th:action="@{/products}" data-autosubmit>
            <div class="search">
                <i class="bi bi-search"></i>
                <input class="input" name="q" th:value="${q}" placeholder="Артикул или наименование">
            </div>
            <select class="input" name="categoryId">
                <option value="">Все категории</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
            </select>
            <button class="btn btn-light" type="submit"><i class="bi bi-search"></i> Найти</button>
        </form>
        <div class="table-wrap" th:if="${!products.isEmpty()}">
            <table class="table">
                <thead>
                <tr><th>Артикул</th><th>Наименование</th><th>Категория</th><th class="num">Цена</th><th class="num">Остаток / мин.</th><th sec:authorize="hasAnyRole('ADMIN','MANAGER')"></th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}" th:with="total=${totals.get(p.id) ?: 0}">
                    <td><span class="chip" th:text="${p.sku}">SKU</span></td>
                    <td>
                        <div class="cell-title" th:text="${p.name}">Товар</div>
                        <div class="cell-sub" th:text="${p.description}"></div>
                    </td>
                    <td><span class="badge badge-violet plain" th:text="${p.category.name}">Категория</span></td>
                    <td class="num strong" th:text="${#numbers.formatDecimal(p.price, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0</td>
                    <td class="num">
                        <span th:classappend="${total < p.minStock} ? 'badge badge-orange plain'"
                              th:text="${#numbers.formatInteger(total, 1, 'WHITESPACE')}">0</span>
                        <span class="muted" th:text="' / ' + ${#numbers.formatInteger(p.minStock, 1, 'WHITESPACE')} + ' ' + ${p.unit}"></span>
                    </td>
                    <td class="num" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                        <div style="display:inline-flex;gap:4px">
                            <a class="btn btn-ghost btn-icon" th:href="@{/products/{id}/edit(id=${p.id})}" title="Изменить"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" data-confirm="Удалить товар из справочника?">
                                <button class="btn btn-ghost btn-icon" type="submit" title="Удалить"><i class="bi bi-trash3"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty" th:if="${products.isEmpty()}"><i class="bi bi-cpu"></i>Товары не найдены</div>
    </div>
</div>
<div id="scripts"></div>
</body>
</html>
