<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Снабжение</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/vendor/inter/inter.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-box-seam"></i></span>
            <span>
                <span class="brand-title">Ростелеком</span>
                <span class="brand-sub d-block" style="display:block">Управление поставками</span>
            </span>
        </a>

        <nav class="nav">
            <div class="nav-label">Обзор</div>
            <a th:href="@{/}" th:classappend="${currentUri == '/'} ? 'active'">
                <i class="bi bi-grid-1x2"></i> Главная
            </a>

            <div class="nav-label">Закупки</div>
            <a th:href="@{/orders}" th:classappend="${#strings.startsWith(currentUri, '/orders')} ? 'active'">
                <i class="bi bi-receipt"></i> Заказы поставщикам
            </a>
            <a th:href="@{/deliveries}" th:classappend="${#strings.startsWith(currentUri, '/deliveries')} ? 'active'">
                <i class="bi bi-truck"></i> Поставки
            </a>
            <a th:href="@{/suppliers}" th:classappend="${#strings.startsWith(currentUri, '/suppliers')} ? 'active'">
                <i class="bi bi-building"></i> Поставщики
            </a>

            <div class="nav-label">Склад</div>
            <a th:href="@{/products}" th:classappend="${#strings.startsWith(currentUri, '/products')} ? 'active'">
                <i class="bi bi-cpu"></i> Номенклатура
            </a>
            <a th:href="@{/warehouses}" th:classappend="${#strings.startsWith(currentUri, '/warehouses')} ? 'active'">
                <i class="bi bi-buildings"></i> Склады
            </a>
            <a th:href="@{/stock}" th:classappend="${currentUri == '/stock'} ? 'active'">
                <i class="bi bi-boxes"></i> Остатки
            </a>
            <a th:href="@{/stock/low}" th:classappend="${currentUri == '/stock/low'} ? 'active'">
                <i class="bi bi-exclamation-triangle"></i> Дефицит
            </a>
        </nav>

        <div class="sidebar-user" th:if="${currentUser != null}">
            <div class="avatar" th:text="${#strings.substring(currentUser.fullName, 0, 1)}">И</div>
            <div style="min-width:0">
                <div class="name" th:text="${currentUser.fullName}">Пользователь</div>
                <div class="role" th:text="${currentUser.role.title}">Роль</div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button class="icon-btn" type="submit" title="Выйти"><i class="bi bi-box-arrow-right"></i></button>
            </form>
        </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn burger" type="button" data-toggle-sidebar aria-label="Меню"><i class="bi bi-list"></i></button>
            <span class="crumbs">Система управления поставками</span>
            <span class="spacer"></span>
            <span class="today"><i class="bi bi-calendar3"></i>
                <span th:text="${#temporals.format(#temporals.createToday(), 'd MMMM yyyy')}">дата</span>
            </span>
        </header>

        <main class="content">
            <div class="alert alert-success" th:if="${success}">
                <i class="bi bi-check-circle-fill"></i><span th:text="${success}">Успех</span>
                <button class="close" type="button" aria-label="Закрыть"><i class="bi bi-x"></i></button>
            </div>
            <div class="alert alert-error" th:if="${error}">
                <i class="bi bi-exclamation-octagon-fill"></i><span th:text="${error}">Ошибка</span>
                <button class="close" type="button" aria-label="Закрыть"><i class="bi bi-x"></i></button>
            </div>

            <th:block th:replace="${content}"/>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<th:block th:replace="${scripts}"/>
</body>
</html>
