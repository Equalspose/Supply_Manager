<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Бейдж статуса заказа -->
<span th:fragment="orderStatus(status)" class="badge"
      th:classappend="'badge-' + ${status.color}" th:text="${status.title}">Статус</span>

<!-- Звёздный рейтинг -->
<span th:fragment="stars(rating)" class="stars" th:title="${rating}">
    <th:block th:each="i : ${#numbers.sequence(1, 5)}"><i class="bi bi-star-fill" th:classappend="${i > rating.doubleValue() + 0.25} ? 'off'"></i></th:block>
</span>

<!-- Пагинация -->
<div th:fragment="pager(page, baseUrl)" class="pager" th:if="${page.totalPages > 1}">
    <span>Показано <b th:text="${page.numberOfElements}">0</b> из <b th:text="${page.totalElements}">0</b></span>
    <div class="pages">
        <a th:if="${page.hasPrevious()}" th:href="${baseUrl + 'page=' + (page.number - 1)}"><i class="bi bi-chevron-left"></i></a>
        <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
            <span class="cur" th:if="${i == page.number}" th:text="${i + 1}">1</span>
            <a th:unless="${i == page.number}"
               th:if="${i < 2 or i > page.totalPages - 3 or (i >= page.number - 1 and i <= page.number + 1)}"
               th:href="${baseUrl + 'page=' + i}" th:text="${i + 1}">2</a>
        </th:block>
        <a th:if="${page.hasNext()}" th:href="${baseUrl + 'page=' + (page.number + 1)}"><i class="bi bi-chevron-right"></i></a>
    </div>
</div>

</body>
</html>
