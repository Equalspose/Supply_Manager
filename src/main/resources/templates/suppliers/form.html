<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content}, ~{::#scripts})}">
<head><title>Поставщик</title></head>
<body>
<div id="content">
    <a class="back-link" th:href="@{/suppliers}"><i class="bi bi-arrow-left"></i> Поставщики</a>
    <div class="page-head">
        <h1 th:text="${supplier.id == null} ? 'Новый поставщик' : 'Редактирование: ' + ${supplier.name}">Поставщик</h1>
    </div>
    <form class="card" th:action="@{/suppliers}" th:object="${supplier}" method="post" style="max-width:900px">
        <input type="hidden" th:field="*{id}">
        <div class="card-body">
            <div class="form-grid">
                <div class="field full">
                    <label>Наименование <span class="req">*</span></label>
                    <input class="input" th:field="*{name}" th:errorclass="is-invalid" placeholder="ООО «Компания»">
                    <div class="error" th:errors="*{name}"></div>
                </div>
                <div class="field">
                    <label>ИНН <span class="req">*</span></label>
                    <input class="input" th:field="*{inn}" th:errorclass="is-invalid" maxlength="12" inputmode="numeric">
                    <div class="error" th:errors="*{inn}"></div>
                </div>
                <div class="field">
                    <label>КПП</label>
                    <input class="input" th:field="*{kpp}" th:errorclass="is-invalid" maxlength="9" inputmode="numeric">
                    <div class="error" th:errors="*{kpp}"></div>
                </div>
                <div class="field">
                    <label>Контактное лицо</label>
                    <input class="input" th:field="*{contactPerson}">
                </div>
                <div class="field">
                    <label>Телефон</label>
                    <input class="input" th:field="*{phone}" placeholder="+7 (___) ___-__-__">
                </div>
                <div class="field">
                    <label>E-mail</label>
                    <input class="input" type="email" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="error" th:errors="*{email}"></div>
                </div>
                <div class="field">
                    <label>Рейтинг надёжности (0–5)</label>
                    <input class="input" type="number" step="0.1" min="0" max="5" th:field="*{rating}" th:errorclass="is-invalid">
                    <div class="error" th:errors="*{rating}"></div>
                </div>
                <div class="field full">
                    <label>Юридический адрес</label>
                    <input class="input" th:field="*{address}">
                </div>
                <div class="field full">
                    <label class="switch"><input type="checkbox" th:field="*{active}"><span class="track"></span> Активный поставщик (доступен для новых заказов)</label>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <a class="btn btn-light" th:href="@{/suppliers}">Отмена</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Сохранить</button>
        </div>
    </form>
</div>
<div id="scripts"></div>
</body>
</html>
